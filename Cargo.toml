[workspace]
members = ["src-tauri", "crates/diff-core"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.20", default-features = false, features = ["https", "ssh"] }
notify = "8"
notify-debouncer-full = "0.5"
thiserror = "2"

[profile.dev.package."*"]
opt-level = 3
